name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Syntax + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check (all modules)
        run: |
          node --check bridge.mjs
          node --check translate.mjs
          node --check zai-config.mjs
          node --check probe.mjs
          bash -n glm-bridge
          bash -n glm-claude
          bash -n install.sh

      - name: Shell script lint (control CLIs)
        run: |
          # los lanzadores deben ser ejecutables
          test -x glm-bridge
          test -x glm-claude
          test -x install.sh
          # help sin romper
          ./glm-bridge 2>&1 | grep -q "uso:" || echo "warn: ayuda no detectada"

      - name: Full QA suite (./qa.sh — sintaxis + unitarios + smokes + instalador hermético + E2E mock, cero cuota)
        run: ./qa.sh
